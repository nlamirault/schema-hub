# HawkEye v7 configuration. To run this locally, use:
# 1. cargo install hawkeye --locked
# 2. hawkeye (check | format)
# Check shows files that do not conform with expectation
# Format updates those files with the header from hack/header.txt

[header]
path = "hack/header.txt"

[files]
includes = [
  "*.yaml",
  "*.yml",
  "*.toml",
  "*.sh",
  "Makefile",
]
excludes = [
  "hack/header.txt",
  "*.json",
  "*.json5",
]
