---
name: Prow / Run Jobs on PR

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - master

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
    - uses: jpmcb/prow-github-actions@v2.0.0
      with:
        jobs: 'lgtm'
        github-token: "${{ secrets.GITHUB_TOKEN }}"
